<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>光學實驗桌</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="光學實驗桌">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; color: #dde2f5; overflow: hidden;
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; -webkit-user-select: none; user-select: none; }
  #bar { position: fixed; top: 0; left: 0; z-index: 2; display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; padding: 4px 8px; height: 36px; box-sizing: border-box;
    background: #151827; border-bottom: 1px solid #262b40; overflow-x: auto; white-space: nowrap; }
  .grp { display: inline-flex; gap: 6px; align-items: center; }
  .grp[hidden], #msg[hidden] { display: none; }
  button.primary { background: #2f6b4a; border-color: #4fb37e; }
  #install { position: fixed; inset: 0; z-index: 9; background: rgba(5,6,12,.78); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #install[hidden] { display: none; }
  #install .card { background: #1a1f35; border: 1px solid #3c4468; border-radius: 12px; padding: 14px 18px; max-width: 420px; font-size: 15px; line-height: 1.7; }
  #install ol { margin: 8px 0 12px; padding-left: 22px; }
  #msg { position: fixed; left: 8px; bottom: 8px; max-width: 60%; z-index: 3; background: rgba(20,24,40,.94); border: 1px solid #3c4468;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.5; color: #f1f3ff; pointer-events: none; }
  button { font: inherit; font-size: 13px; color: #dde2f5; background: #20253b; border: 1px solid #343b5c; border-radius: 8px;
    min-height: 28px; padding: 2px 10px; cursor: pointer; touch-action: manipulation; }
  button[aria-pressed="true"] { background: #3a4a9a; border-color: #6c80ff; color: #fff; }
  .seg { display: inline-flex; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #b-full { position: fixed; right: 10px; bottom: 10px; z-index: 4; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(32,37,59,.92); border-radius: 10px; }
  #b-full[hidden] { display: none; }
  #b-full svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #b-full .i-share { display: none; } #b-full.is-install .i-in, #b-full.is-install .i-out { display: none; } #b-full.is-install .i-share { display: block; }
  #b-full .i-out { display: none; } #b-full.is-full .i-in { display: none; } #b-full.is-full .i-out { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <span id="grp-obs" class="grp">
    <span class="seg"><button id="b-convex" aria-pressed="true">凸透鏡</button><button id="b-concave" aria-pressed="false">凹透鏡</button></span>
    <button id="b-mark">找到像了</button>
    <button id="b-ana" class="primary">分析光路</button>
    <button id="t-rays" aria-pressed="false">示範光路</button>
    <button id="t-data" aria-pressed="true">數據</button>
    <button id="t-back" aria-pressed="false">光屏：透鏡側看</button>
    <button id="b-reset">重設</button>
  </span>
  <span id="grp-ana" class="grp" hidden>
    <button id="b-undo">復原</button>
    <button id="b-clear">清除線</button>
    <button id="t-ans" aria-pressed="false">對答案</button>
    <button id="b-back" class="primary">回實驗桌</button>
  </span>
</div>
<div id="msg" hidden></div>
<button id="b-full" aria-label="全螢幕" title="全螢幕">
  <svg class="i-in" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="i-out" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  <svg class="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
</button>
<div id="install" hidden><div class="card"><b>iPhone 要全螢幕（沒有網址列）</b><ol><li>點 Safari 的「分享」按鈕（方框加向上箭頭）</li><li>選「加入主畫面」</li><li>以後從主畫面的圖示開啟就是全螢幕</li></ol><button id="install-ok">知道了</button></div></div>
<script src="landscape.js"></script>
<script src="config.js"></script>
<script src="optics.js"></script>
<script src="app.js"></script>
<script src="fullscreen.js"></script>
</body>
</html>
