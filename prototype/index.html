<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光學抓鬼 — 選單</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
  html, body { margin:0; min-height:100%; background:#0d1020; color:#e8ebff;
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:0 0 14px; }
  #menu { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  a.card, button { -webkit-tap-highlight-color:transparent; }
  a.card { display:block; padding:16px; border:1px solid #3b4478; border-radius:14px; background:#171b33; color:inherit; text-decoration:none; min-height:48px; }
  a.card:active { background:#232a4d; }
  a.card.main { border-color:#b980ff; background:#1d1436; }
  a.card strong { display:block; font-size:18px; margin-bottom:4px; }
  a.card span { color:#9aa3cf; font-size:14px; line-height:1.5; }
  a.card em { display:block; font-style:normal; color:#ffd166; font-size:13px; margin-top:6px; }
  a.card.dev { border-style:dashed; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .row a.card { text-align:center; }
  #creditsLink { margin-top:12px; text-align:center; }
  #installBtn { display:block; width:100%; margin-top:12px; min-height:48px; font:inherit; font-size:15px; color:#e8ebff; background:#171b33; border:1px dashed #3b4478; border-radius:12px; cursor:pointer; }
  #resetBtn { min-height:48px; font:inherit; font-size:15px; color:#e8ebff; background:#232a4d; border:1px solid #3b4478; border-radius:12px; cursor:pointer; }
  #fsTip { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(5,6,14,.86); }
  #fsTip .box { max-width:520px; width:100%; padding:20px; border:1px solid #b980ff; border-radius:16px; background:#1d1436; line-height:1.65; font-size:16px; }
  #fsTip h2 { margin:0 0 8px; font-size:20px; }
  #fsTip ul { margin:8px 0 16px; padding-left:22px; }
  #fsTip button { display:block; width:100%; min-height:52px; font:inherit; font-size:17px; font-weight:600; color:#e8ebff; background:#5b2a86; border:1px solid #b980ff; border-radius:12px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>光學抓鬼</h1>
  <div id="menu"></div>
  <div class="row">
    <a class="card" id="lbLink" href="leaderboard.html"><strong>排行榜</strong></a>
    <button id="resetBtn" type="button">重新開始遊戲<br>（清除過關紀錄）</button>
  </div>
  <button id="installBtn" type="button" hidden>📲 安裝到手機（全螢幕、沒有網址列）</button>
  <a class="card" id="creditsLink" href="credits.html"><strong>製作與素材</strong></a>
</main>
<script src="shared/landscape.js"></script>
<script src="shared/install-hint.js"></script>
<script src="shared/progress.js"></script>
<script src="shared/leaderboard-config.js"></script>
<script src="shared/leaderboard.js"></script>
<script>
/*
 * 選單逐步解鎖（使用者試玩回饋 G4，2026-11-18）：
 *   - 第 N 關的入口：前一關過關後出現（第一關一開始就有；第一關沒過之前叫「開始遊戲」）。
 *   - 第 N 關的練習模式（?practice=1：扣命、不計時、不計排行）：第 N 關過關後出現。
 *   - 第三關「荒野狩獵」（concave-lens/：5 分鐘、3 條命，結束時上傳排行榜）；結束一次後解鎖荒野練習模式。
 * 網址加 ?unlock=1：全部顯示（老師／開發用），並多出開發用的自由練習入口。
 * G2：第一次從選單按「開始遊戲」時，先教怎麼離開全螢幕（只出現這一次）。
 */
(function () {
  'use strict';
  var P = window.GameProgress, all = /[?&]unlock=1/.test(location.search);
  var FS_TIP_KEY = 'opticsGhost.fsTip.v1';
  function cleared(id) { return all || P.isCleared(id); }
  function unlocked(id) { return all || P.isUnlocked(id); }

  var items = [];
  if (!cleared('mirror')) items.push({ id: 'start', href: 'plane-mirror/index.html', title: '開始遊戲', sub: '古堡邀請，充滿鏡子的房間', main: true });
  else items.push({ id: 'mirror', href: 'plane-mirror/index.html', title: '第一關：鏡子房間', sub: '鏡子中，有一個女鬼' });
  if (cleared('mirror')) items.push({ id: 'mirror-practice', href: 'plane-mirror/index.html?practice=1', title: '第一關：練習模式', sub: '扣命、不計時、不列入排行' });
  if (unlocked('convex')) items.push({ id: 'convex', href: 'convex-lens/index.html', title: '第二關：城堡走廊', sub: '城堡裡到處都是鬼，請趕走他們', main: !cleared('convex') });
  if (cleared('convex')) items.push({ id: 'convex-practice', href: 'convex-lens/index.html?practice=1', title: '第二關：練習模式', sub: '扣命、不計時、不列入排行' });
  if (unlocked('concave')) items.push({ id: 'concave', href: 'concave-lens/index.html', title: '第三關：荒野狩獵', sub: '趁天亮前，多封印幾隻', main: !cleared('concave') });
  if (cleared('concave')) items.push({ id: 'concave-practice', href: 'concave-lens/index.html?practice=1', title: '第三關：練習模式（不計時）', sub: '不列入排行' });
  if (all) {
    items.push({ id: 'mirror-free', href: 'plane-mirror/index.html?free=1', title: '平面鏡 — 自由練習（開發用）', sub: '沒有過場、不計命；可指定鏡子數與鬼的位置、開 Debug。', dev: true });
    items.push({ id: 'convex-free', href: 'convex-lens/index.html?free=1', title: '凸透鏡 — 自由練習（開發用）', sub: '沒有過場、不計命；可指定配置、開 Debug。', dev: true });
  }
  // 只有一個「主要」入口（下一步該玩的那一關）
  var mains = items.filter(function (it) { return it.main; });
  mains.slice(0, -1).forEach(function (it) { it.main = false; });

  var menu = document.getElementById('menu');
  items.forEach(function (it) {
    var a = document.createElement('a');
    a.className = 'card' + (it.main ? ' main' : '') + (it.dev ? ' dev' : '');
    a.href = it.href; a.setAttribute('data-item', it.id);
    var s = document.createElement('strong'); s.textContent = it.title; a.appendChild(s);
    var sp = document.createElement('span'); sp.textContent = it.sub; a.appendChild(sp);
    if (it.note) { var em = document.createElement('em'); em.textContent = it.note; a.appendChild(em); }
    menu.appendChild(a);
  });

  // ---- G2 全螢幕教學：只在第一次按「開始遊戲」時跳出 ----
  // 只在關卡會切全螢幕的裝置上教（條件同 shared/fullscreen.js）；?fstip=1 強制顯示（測試用）。
  function willFullscreen() {
    if (/[?&]fstip=1/.test(location.search)) return true;
    if (navigator.webdriver) return false;
    var el = document.documentElement, mm = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
    return !!(el.requestFullscreen || el.webkitRequestFullscreen) && !navigator.standalone &&
      !mm('(display-mode: standalone)') && !mm('(display-mode: fullscreen)') && mm('(pointer: coarse)');
  }
  function tipSeen() { try { return !!localStorage.getItem(FS_TIP_KEY); } catch (e) { return false; } }
  var start = menu.querySelector('a[data-item="start"]');
  if (start) start.addEventListener('click', function (e) {
    if (tipSeen() || !willFullscreen()) return;
    e.preventDefault();
    try { localStorage.setItem(FS_TIP_KEY, '1'); } catch (err) { /* 無痕模式：下次可能再出現，沒關係 */ }
    var tip = document.createElement('div');
    tip.id = 'fsTip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-label', '全螢幕說明');
    tip.innerHTML = '<div class="box"><h2>遊戲會切成全螢幕</h2>' +
      '進關卡後碰一下畫面，就會變成全螢幕。想離開全螢幕：' +
      '<ul><li>按手機的「返回」：下方的 ◁，或從螢幕左邊／右邊邊緣往內滑。</li>' +
      '<li>想換關卡，按右上角的「☰ 關卡」回到這個選單。</li></ul>' +
      '<button type="button" id="fsTipGo">知道了，開始遊戲</button></div>';
    document.body.appendChild(tip);
    document.getElementById('fsTipGo').addEventListener('click', function () { location.href = start.href; });
  });

  // 「安裝到手機」：自動提示只在第一次跳（shared/install-hint.js），之後從這裡打開（使用者 2026-11-21）。已安裝就不顯示。
  var ib = document.getElementById('installBtn');
  if (window.InstallHint && !window.InstallHint.installed()) {
    ib.hidden = false;
    ib.addEventListener('click', function () { window.InstallHint.open(); });
  }

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (window.confirm('清除這台裝置上的過關紀錄，從第一關重新開始？（趕鬼時間也會重新計算）')) {
      P.reset(); if (window.Leaderboard) window.Leaderboard.restartRun(); location.reload();
    }
  });
})();
</script>
</body>
</html>
