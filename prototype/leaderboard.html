<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排行榜 — 光學抓鬼</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
  html, body { margin:0; min-height:100%; background:#0d1020; color:#e8ebff;
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width:900px; margin:0 auto; padding:14px 16px 24px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  h1 { font-size:22px; margin:0; flex:1; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; min-width:88px; padding:4px 16px;
    font:inherit; font-size:15px; color:#e8ebff; background:#232a4d; border:1px solid #3b4478; border-radius:12px; text-decoration:none; cursor:pointer; }
  .mode { margin:0 0 12px; font-size:14px; color:#9aa3cf; }
  .mode.err { color:#ff8a8a; }
  /* 2026-11-21：一次看一個榜（分頁標籤），每列 名次｜暱稱｜成績｜日期，每頁 10 名可翻頁 */
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .tab { min-height:46px; font:inherit; font-size:16px; color:#e8ebff; background:#171b33; border:1px solid #3b4478; border-radius:12px; cursor:pointer; }
  .tab.on { background:#5b2a86; border-color:#b980ff; font-weight:600; }
  section { background:#171b33; border:1px solid #3b4478; border-radius:14px; padding:10px 14px; }
  .sub { margin:0 0 6px; font-size:13px; color:#9aa3cf; }
  ol { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; min-height:38px; border-top:1px solid #262c52; font-size:16px; }
  li:first-child { border-top:0; }
  .rk { width:36px; text-align:center; font-weight:700; color:#9aa3cf; font-variant-numeric:tabular-nums; }
  li.r1 .rk { color:#ffd166; } li.r2 .rk { color:#cfd5f5; } li.r3 .rk { color:#d89a6a; }
  .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vl { font-variant-numeric:tabular-nums; color:#ffd166; }
  .dt { width:48px; text-align:right; font-size:13px; color:#9aa3cf; font-variant-numeric:tabular-nums; }
  li.me { background:rgba(185,128,255,.14); border-radius:8px; }
  li.me .nm { color:#d3b2ff; font-weight:600; }
  .empty { padding:12px 0; color:#9aa3cf; font-size:15px; }
  .pager { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .pager .info { font-size:14px; color:#9aa3cf; }
  .btn:disabled { opacity:.4; cursor:default; }
  #findMe { background:#1d1436; border-color:#b980ff; }
</style>
</head>
<body>
<main>
  <header>
    <a class="btn" href="index.html">← 選單</a>
    <h1>排行榜</h1>
    <button class="btn" id="refresh" type="button">重新整理</button>
  </header>
  <p class="mode" id="mode">讀取中…</p>
  <div class="tabs" role="tablist">
    <button class="tab on" id="tabCastle" type="button" role="tab" data-board="castle">趕鬼時間</button>
    <button class="tab" id="tabHunt" type="button" role="tab" data-board="hunt">荒野封印</button>
  </div>
  <section>
    <p class="sub" id="sub"></p>
    <ol id="list"></ol>
    <div class="pager">
      <button class="btn" id="prev" type="button">◀ 上一頁</button>
      <span class="info" id="pageInfo"></span>
      <button class="btn" id="next" type="button">下一頁 ▶</button>
      <button class="btn" id="findMe" type="button">找我的名次</button>
    </div>
  </section>
</main>
<script src="shared/landscape.js"></script>
<script src="shared/leaderboard-config.js"></script>
<script src="shared/leaderboard.js"></script>
<script>
(function () {
  'use strict';
  var SUB = { castle: '第一關開始到第二關結束，愈短愈好', hunt: '5 分鐘荒野狩獵封印的鬼數（練習模式不算）' };
  var FMT = { castle: Leaderboard.formatTime, hunt: function (v) { return v + ' 隻'; } };
  var st = { board: /[?&]board=hunt/.test(location.search) ? 'hunt' : 'castle', page: 1, pages: 1, mark: 0, seq: 0 };
  function $(id) { return document.getElementById(id); }
  function fmtDate(at) { if (!at) return ''; var d = new Date(at); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function render(r, board) {
    var ol = $('list');
    ol.textContent = '';
    if (!r.rows || !r.rows.length) { var e = document.createElement('li'); e.className = 'empty'; e.textContent = '還沒有人上榜'; ol.appendChild(e); }
    (r.rows || []).forEach(function (x) {
      var li = document.createElement('li');
      li.className = (x.rank <= 3 ? 'r' + x.rank : '') + (x.me || x.rank === st.mark ? ' me' : '');
      [['rk', String(x.rank)], ['nm', x.name], ['vl', FMT[board](x.value)], ['dt', fmtDate(x.at)]].forEach(function (c) {
        var sp = document.createElement('span'); sp.className = c[0]; sp.textContent = c[1]; li.appendChild(sp);
      });
      ol.appendChild(li);
    });
    st.page = r.page || 1; st.pages = r.pages || 1;
    $('pageInfo').textContent = '第 ' + st.page + '／' + st.pages + ' 頁' + (r.total ? '（共 ' + r.total + ' 人）' : '');
    $('prev').disabled = st.page <= 1; $('next').disabled = st.page >= st.pages;
  }
  function load(page) {
    var mode = $('mode');
    mode.className = 'mode'; mode.textContent = '讀取中…';
    $('sub').textContent = SUB[st.board];
    ['castle', 'hunt'].forEach(function (b) { var t = $(b === 'castle' ? 'tabCastle' : 'tabHunt'); t.classList.toggle('on', b === st.board); t.setAttribute('aria-selected', String(b === st.board)); });
    // 回應回來時使用者可能已經切到另一個榜：只收最新一次要求的回應，格式也照「要求時」的榜（使用者 2026-11-21：荒野榜閃出 308087 隻）
    var board = st.board, seq = ++st.seq;
    return Leaderboard.fetchPage(board, page || 1).then(function (r) {
      if (seq !== st.seq) return;
      render(r, board);
      if (!r.ok) { mode.className = 'mode err'; mode.textContent = r.error || '讀取失敗'; return; }
      mode.textContent = r.mode === 'local' ? '還沒連上共用排行榜：這裡只顯示這支手機上的成績。'
        : r.legacy ? '排行榜後台還沒更新：目前只顯示前 10 名、不能翻頁。'
          : '所有玩家共用的排行榜。同一支手機、同一個暱稱只留最好的成績。';
    });
  }
  function switchTo(b) { if (b === st.board) return; st.board = b; st.mark = 0; load(1); }
  $('tabCastle').addEventListener('click', function () { switchTo('castle'); });
  $('tabHunt').addEventListener('click', function () { switchTo('hunt'); });
  $('prev').addEventListener('click', function () { if (st.page > 1) load(st.page - 1); });
  $('next').addEventListener('click', function () { if (st.page < st.pages) load(st.page + 1); });
  $('findMe').addEventListener('click', function () {
    var mode = $('mode');
    Leaderboard.fetchMyRank(st.board).then(function (r) {
      if (!r.ok) { mode.className = 'mode err'; mode.textContent = r.error || '讀取失敗'; return; }
      if (!r.rank) { mode.className = 'mode'; mode.textContent = Leaderboard.getNickname() ? '這支手機的「' + Leaderboard.getNickname() + '」還沒在這個榜上。' : '這支手機還沒有上傳過成績。'; return; }
      st.mark = r.rank;
      load(r.page).then(function () { var m = document.querySelector('#list li.me'); if (m && m.scrollIntoView) m.scrollIntoView({ block: 'center' }); $('mode').textContent = '你是第 ' + r.rank + ' 名。'; });
    });
  });
  $('refresh').addEventListener('click', function () { load(st.page); });
  load(1);
})();
</script>
</body>
</html>
