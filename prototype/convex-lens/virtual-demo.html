<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凸透鏡虛像題 示範</title>
<style>
  html, body { margin:0; height:100%; background:#0d0f1c; color:#e8ebff; font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { display:flex; flex-direction:column; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; padding:6px 8px; align-items:center; background:#161a30; }
  .bar select, .bar button { min-height:44px; font-size:15px; border-radius:10px; border:1px solid #3a4170; background:#20264a; color:#e8ebff; padding:0 12px; }
  .bar button.on { background:#6b5a1e; border-color:#e0c25a; }
  .bar button.primary { background:#2c5a3a; border-color:#6fd18f; }
  .seg { display:inline-flex; }
  .seg button:first-child { border-radius:10px 0 0 10px; }
  .seg button:last-child { border-radius:0 10px 10px 0; border-left:none; }
  .bar label { font-size:13px; color:#aab3e6; }
  #info { padding:4px 10px; font-size:15px; min-height:22px; background:#11142a; }
  #say { padding:6px 10px; font-size:17px; color:#ffe9a8; background:#2a2140; display:none; }
  #wrap { flex:1; position:relative; min-height:220px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .nudge { display:flex; gap:6px; padding:6px 8px; background:#161a30; }
  .nudge button { flex:1; min-height:48px; font-size:16px; border-radius:10px; border:1px solid #3a4170; background:#20264a; color:#e8ebff; }
</style>
</head>
<body>
<div class="bar">
  <label>題目</label>
  <select id="preset"></select>
  <label>透鏡範圍</label>
  <select id="range">
    <option value="full">整條走廊（鬼和布幕之間）</option>
    <option value="inF">只在鬼和焦點之間</option>
  </select>
  <span class="seg"><button id="viewScreen" type="button" class="on">看布幕</button><button id="viewLens" type="button">看凸透鏡</button></span>
  <button id="markBtn" class="primary" type="button">標記</button>
  <button id="rayBtn" type="button" class="on">顯示鬼和光線（示範用）</button>
</div>
<div id="info"></div>
<div id="say"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="nudge">
  <button id="left" type="button">◀ 透鏡往鬼移</button>
  <button id="right" type="button">透鏡往布幕移 ▶</button>
</div>
<script>
/*
 * 凸透鏡虛像題的示範頁（不是正式關卡）。給使用者試玩「看布幕／看凸透鏡」的流程，
 * 比較不同題目與透鏡範圍時，會不會出現實像。
 * 座標：走廊側視，布幕在 X = 0，走廊往左到 X = -1000；主光軸 y = 0（上為正），地板 y = -150。
 * 玩家（眼睛）站在布幕那一側，X = 0。單位 cm。
 */
(function () {
  'use strict';
  var CORRIDOR = 1000, AXIS = 150, R = 120, HW = 25, HH = 35, LOCK = 0.18, LENS_MIN = -620, LENS_MAX = -80;
  var PRESETS = [
    { name: '對照：現有實像題 E（第 5 格，f=110）', cell: 5, f: 110, h: -60 },
    { name: '虛像：第 3 格，f=220（全程不會有實像）', cell: 3, f: 220, h: 30 },
    { name: '虛像：第 4 格，f=200', cell: 4, f: 200, h: 30 },
    { name: '虛像：第 5 格，f=220', cell: 5, f: 220, h: -30 },
    { name: '虛像：第 6 格，f=200', cell: 6, f: 200, h: 30 },
    { name: '虛像：第 7 格，f=210', cell: 7, f: 210, h: -30 }
  ];
  var st = { p: null, ox: 0, lens: -300, view: 'screen', rays: true, mark: null };
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1;

  PRESETS.forEach(function (p, i) { var o = document.createElement('option'); o.value = i; o.textContent = p.name; $('preset').appendChild(o); });

  function lensRange() {
    var p = st.p, lo = Math.max(LENS_MIN, st.ox + 20), hi = LENS_MAX;
    if ($('range').value === 'inF') hi = Math.min(hi, st.ox + p.f - 15);
    return [lo, hi];
  }
  function clampLens(x) { var r = lensRange(); return Math.max(r[0], Math.min(r[1], x)); }

  function load(i) {
    $('preset').value = String(i); st.p = PRESETS[i]; st.ox = -(st.p.cell - 0.5) * 100; st.mark = null;
    var r = lensRange(); st.lens = Math.round((r[0] + r[1]) / 2);
    say(''); update();
  }

  // 成像：u 物距、v 像距（正＝實像在透鏡右邊；負＝虛像在左邊）、m 放大率
  function optics() {
    var f = st.p.f, u = st.lens - st.ox, out = { u: u, f: f };
    if (Math.abs(u - f) < 0.5) { out.inf = true; return out; }
    out.v = u * f / (u - f); out.m = -out.v / u; out.x = st.lens + out.v; out.y = out.m * st.p.h;
    out.real = out.v > 0;
    var s = -st.lens; // 透鏡到布幕
    out.blur = R * Math.abs(1 - s / out.v);
    out.scaleOnScreen = s / u;
    out.blurRatio = out.blur / (HW * out.scaleOnScreen);
    out.sharpOnScreen = out.real && out.blurRatio < LOCK;
    // 從布幕這邊（眼睛在 X=0）隔著透鏡看
    if (!out.real) out.eye = 'virtual';
    else if (out.x < -25) out.eye = 'realInFront'; // 實像在眼睛前面（透鏡和眼睛之間）：看得到倒立的像
    else out.eye = 'blur';
    return out;
  }

  function say(t) { var e = $('say'); e.textContent = t; e.style.display = t ? 'block' : 'none'; }

  function update() {
    var o = optics(), p = st.p, t;
    if (o.inf) t = '物距 = 焦距：光線出透鏡後平行，不成像。';
    else {
      t = '物距 ' + Math.round(o.u) + '、焦距 ' + p.f + ' → ';
      t += o.real ? '實像（倒立）在透鏡右邊 ' + Math.round(o.v) + ' cm' + (o.x > 0 ? '（在布幕後面，看不到）' : '') + '，放大率 ' + Math.abs(o.m).toFixed(2)
                  : '虛像（正立）在透鏡左邊 ' + Math.round(-o.v) + ' cm，放大率 ' + o.m.toFixed(2);
      if (st.view === 'screen') t += o.sharpOnScreen ? '｜布幕上：清楚的像' : '｜布幕上：模糊的光';
      else t += o.eye === 'virtual' ? '｜透鏡裡：放大、正立的鬼' : o.eye === 'realInFront' ? '｜透鏡裡：倒立的像' : '｜透鏡裡：模糊看不清';
    }
    var D = -st.ox; if (D <= 4 * p.f) t += '｜這題布幕上永遠不會有清楚的像（鬼到布幕 ' + D + ' ≤ 4f = ' + 4 * p.f + '）';
    $('info').textContent = t;
    $('viewScreen').classList.toggle('on', st.view === 'screen');
    $('viewLens').classList.toggle('on', st.view === 'lens');
    draw();
  }

  // ---------- 畫圖 ----------
  function resize() {
    var r = $('wrap').getBoundingClientRect(); DPR = window.devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); draw();
  }
  var side, panel, k;
  function layout() {
    var pw = Math.max(150, Math.min(W * 0.3, H * 0.9));
    side = { x: 8, y: 8, w: W - pw - 24, h: H - 16 };
    panel = { x: W - pw - 8, y: 8, w: pw, h: H - 16 };
    k = Math.min(side.w / CORRIDOR, side.h / (2 * AXIS + 70));
  }
  function w2s(x, y) { return { x: side.x + (x + CORRIDOR) * k, y: side.y + side.h / 2 - 12 - y * k }; }

  function ghostPath(px, py, hw, hh, sx, sy) {
    var i; ctx.beginPath();
    for (i = 0; i <= 16; i++) { var a = Math.PI - Math.PI * i / 16; var x = px + sx * Math.cos(a) * hw, y = py + sy * (-(hh - hw) - Math.sin(a) * hw); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
    for (i = 0; i <= 12; i++) { var u = 1 - i / 6; ctx.lineTo(px + sx * u * hw, py + sy * (hh - Math.abs(Math.sin(i / 12 * Math.PI * 3)) * hh * 0.22)); }
    ctx.closePath();
    var e = function (ox, oy, rx, ry) { ctx.moveTo(px + sx * ox + rx, py + sy * oy); ctx.ellipse(px + sx * ox, py + sy * oy, rx, ry, 0, 0, 7); };
    e(-hw * 0.36, -hh * 0.3, hw * 0.16, hh * 0.16); e(hw * 0.36, -hh * 0.3, hw * 0.16, hh * 0.16); e(0, hh * 0.08, hw * 0.2, hh * 0.1);
    e(hw * 1.22, -hh * 0.05, hw * 0.24, hw * 0.24);
  }
  function line(a, b, color, dash, wdt) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wdt || 2; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore(); }
  function text(t, x, y, c, al) { ctx.fillStyle = c || '#cfd5ff'; ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = al || 'center'; ctx.fillText(t, x, y); }
  // 從 (x0,y0) 沿方向 (dx,dy) 一直走到 X = xEnd
  function toX(x0, y0, dx, dy, xEnd) { return { x: xEnd, y: y0 + dy * (xEnd - x0) / dx }; }

  function drawSide(o) {
    var p = st.p;
    ctx.save(); ctx.beginPath(); ctx.rect(side.x, side.y, side.w, side.h); ctx.clip();
    ctx.fillStyle = '#141833'; ctx.fillRect(side.x, side.y, side.w, side.h);
    // 地板格
    for (var c = 1; c <= 10; c++) {
      var a = w2s(-c * 100, -AXIS), b = w2s(-(c - 1) * 100, -AXIS);
      ctx.fillStyle = c === p.cell ? 'rgba(255,220,120,.18)' : 'rgba(255,255,255,.04)'; ctx.fillRect(a.x, a.y, b.x - a.x, 18);
      ctx.strokeStyle = '#3a4170'; ctx.strokeRect(a.x, a.y, b.x - a.x, 18); text(String(c), (a.x + b.x) / 2, a.y + 14, '#8f98c9');
    }
    line(w2s(-CORRIDOR, 0), w2s(0, 0), 'rgba(140,150,220,.5)', [10, 4, 3, 4], 1);
    // 布幕與眼睛
    line(w2s(0, -AXIS), w2s(0, AXIS), '#cbb27a', null, 4); text('布幕', w2s(0, AXIS).x - 18, w2s(0, AXIS).y + 14, '#cbb27a');
    var eye = w2s(-12, 0); ctx.fillStyle = '#9fd3ff'; ctx.beginPath(); ctx.arc(eye.x, eye.y, 5, 0, 7); ctx.fill(); text('你', eye.x - 4, eye.y - 10, '#9fd3ff');
    // 透鏡可移動範圍
    var rr = lensRange(), r0 = w2s(rr[0], -AXIS + 22), r1 = w2s(rr[1], -AXIS + 22);
    line(r0, r1, 'rgba(120,200,255,.6)', null, 6);
    // 焦點
    [-1, 1].forEach(function (sg) { var q = w2s(st.lens + sg * p.f, 0); if (q.x > side.x && q.x < side.x + side.w) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, 7); ctx.fill(); text(sg < 0 ? 'F' : "F′", q.x, q.y + 18, '#fff'); } });
    // 透鏡
    var lt = w2s(st.lens, R), lb = w2s(st.lens, -R);
    ctx.save(); ctx.fillStyle = 'rgba(140,200,255,.25)'; ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(lt.x, (lt.y + lb.y) / 2, 9, (lb.y - lt.y) / 2, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    // 鬼（正式遊戲裡肉眼看不到；示範用才畫）
    var g = w2s(st.ox, p.h);
    if (st.rays) { ctx.save(); ctx.fillStyle = '#7dffc8'; ghostPath(g.x, g.y, HW * k, HH * k, 1, 1); ctx.fill('evenodd'); ctx.restore();
    text('鬼', g.x, g.y - HH * k - 6, '#7dffc8'); }

    if (st.rays && !o.inf) {
      var L = st.lens, h = p.h, f = p.f, Pt = w2s(L, h), Ot = w2s(L, 0);
      // 光線 1：平行主光軸 → 折射後通過 F′
      line(g, Pt, '#ffd36b');
      var e1 = toX(L, h, f, -h, 0); line(Pt, w2s(e1.x, e1.y), '#ffd36b');
      // 光線 2：通過光心
      var e2 = toX(st.ox, h, L - st.ox, -h, 0); line(g, w2s(e2.x, e2.y), '#ffd36b');
      if (!o.real) {
        // 虛像：折射後的光是發散的，反向延長（虛線）交在左邊
        var xi = Math.max(-CORRIDOR, o.x);
        line(Pt, w2s(xi, toX(L, h, f, -h, xi).y), 'rgba(255,211,107,.8)', [6, 5], 1.5);
        line(Ot, w2s(xi, toX(st.ox, h, L - st.ox, -h, xi).y), 'rgba(255,211,107,.8)', [6, 5], 1.5);
      }
      if (o.x > -CORRIDOR && o.x < 0) {
        var ip = w2s(o.x, o.y);
        ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = o.real ? '#ff9ad5' : '#b7a6ff';
        var am = Math.abs(o.m); ghostPath(ip.x, ip.y, HW * am * k, HH * am * k, o.real ? -1 : 1, o.real ? -1 : 1); ctx.fill('evenodd'); ctx.restore();
        text(o.real ? '實像' : '虛像', ip.x, ip.y - HH * Math.abs(o.m) * k - 6, o.real ? '#ff9ad5' : '#b7a6ff');
      } else if (o.x <= -CORRIDOR) text('虛像在走廊外面', side.x + 70, side.y + 20, '#b7a6ff');
    }
    if (st.mark) { var m = w2s(st.mark.x, st.mark.y); ctx.strokeStyle = '#ff4fa8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(m.x, m.y, 12, 0, 7); ctx.moveTo(m.x - 18, m.y); ctx.lineTo(m.x + 18, m.y); ctx.moveTo(m.x, m.y - 18); ctx.lineTo(m.x, m.y + 18); ctx.stroke(); text(st.mark.label, m.x, m.y + 32, '#ff4fa8'); }
    ctx.restore();
  }

  function drawPanel(o) {
    var p = st.p, cx = panel.x + panel.w / 2, cy = panel.y + panel.h / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(panel.x, panel.y, panel.w, panel.h); ctx.clip();
    ctx.fillStyle = '#0a0b16'; ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
    if (st.view === 'screen') {
      text('布幕（正面看）', panel.x + 8, panel.y + 16, '#aab3e6', 'left');
      var ks = Math.min(panel.w * 0.45 / 80, panel.h * 0.42 / AXIS);
      ctx.fillStyle = '#4b473d'; ctx.fillRect(cx - 80 * ks, cy - AXIS * ks, 160 * ks, 2 * AXIS * ks);
      if (!o.inf) {
        var n = o.blur * ks < 0.4 ? 1 : 24, hw = HW * o.scaleOnScreen * ks, hh = HH * o.scaleOnScreen * ks, py = cy + p.h * o.scaleOnScreen * ks, b = Math.min(o.blur, 400) * ks;
        ctx.save(); ctx.beginPath(); ctx.rect(cx - 80 * ks, cy - AXIS * ks, 160 * ks, 2 * AXIS * ks); ctx.clip();
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#7dffc8'; ctx.globalAlpha = n === 1 ? 1 : 1 / n * (o.blur > 200 ? 0.6 : 1);
        for (var i = 0; i < n; i++) { var rr = n === 1 ? 0 : b * Math.sqrt((i + 0.5) / n), th = i * 2.4; ghostPath(cx + rr * Math.cos(th), py + rr * Math.sin(th), hw, hh, -1, -1); ctx.fill('evenodd'); }
        ctx.restore();
      }
    } else {
      text('隔著凸透鏡看（你站在布幕這邊）', panel.x + 8, panel.y + 16, '#aab3e6', 'left');
      // 角度換成畫面：鏡框的角半徑對到面板的 40%
      var lensLabel = null, dLens = -st.lens, angR = R / dLens, K = Math.min(panel.w, panel.h) * 0.4 / angR;
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, angR * K, 0, 7); ctx.fillStyle = '#1b2036'; ctx.fill(); ctx.clip();
      if (!o.inf && o.eye !== 'blur') {
        var d = -o.x, s = 1 / d; // 像到眼睛的距離
        var am = Math.abs(o.m), gx = cx, gy = cy - o.y * s * K, ghw = HW * am * s * K, ghh = HH * am * s * K;
        // 看到的是鬼的「像」，不是鬼本體：和側視圖一樣，虛像紫色、實像粉紅，半透明
        ctx.save(); ctx.globalAlpha = 0.75; ctx.fillStyle = o.real ? '#ff9ad5' : '#b7a6ff';
        ghostPath(gx, gy, ghw, ghh, o.real ? -1 : 1, o.real ? -1 : 1); ctx.fill('evenodd'); ctx.restore();
        lensLabel = [o.real ? '鬼的實像（倒立）' : '鬼的虛像（正立、放大）', o.real ? '#ff9ad5' : '#b7a6ff'];
      } else if (!o.inf) {
        var gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, angR * K); gr.addColorStop(0, 'rgba(125,255,200,.35)'); gr.addColorStop(1, 'rgba(125,255,200,.05)');
        ctx.fillStyle = gr; ctx.fillRect(cx - angR * K, cy - angR * K, 2 * angR * K, 2 * angR * K);
      }
      ctx.restore();
      ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, angR * K, 0, 7); ctx.stroke();
      text(lensLabel ? lensLabel[0] : (o.inf ? '' : '模糊，看不清楚'), cx, cy + angR * K + 18, lensLabel ? lensLabel[1] : '#8f98c9');
    }
    ctx.restore();
  }

  function draw() { if (!W || !st.p) return; layout(); ctx.clearRect(0, 0, W, H); var o = optics(); drawSide(o); drawPanel(o); }

  // ---------- 操作 ----------
  function moveLens(x) { var nx = clampLens(x); if (nx !== st.lens) { st.lens = nx; st.mark = null; say(''); update(); } }
  var drag = null;
  cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, lens: st.lens }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) { if (drag) moveLens(drag.lens + (e.clientX - drag.x) / k); });
  cv.addEventListener('pointerup', function () { drag = null; });
  cv.addEventListener('pointercancel', function () { drag = null; });
  $('left').addEventListener('click', function () { moveLens(st.lens - 10); });
  $('right').addEventListener('click', function () { moveLens(st.lens + 10); });
  $('preset').addEventListener('change', function () { load(Number(this.value)); });
  $('range').addEventListener('change', function () { st.lens = clampLens(st.lens); st.mark = null; say(''); update(); });
  function setView(v) { if (st.view === v) return; st.view = v; st.mark = null; say(''); update(); }
  $('viewScreen').addEventListener('click', function () { setView('screen'); });
  $('viewLens').addEventListener('click', function () { setView('lens'); });
  $('rayBtn').addEventListener('click', function () { st.rays = !st.rays; this.classList.toggle('on', st.rays); draw(); });
  $('markBtn').addEventListener('click', function () {
    var o = optics();
    if (o.inf) { say('（看不到清楚的像，不能標記）'); return; }
    if (st.view === 'screen') {
      if (o.sharpOnScreen) { st.mark = { x: 0, y: o.y, label: '實像標記' }; say('你：這是倒立' + (Math.abs(o.m) > 1 ? '、放大' : '、縮小') + '的實像。'); }
      else say('（布幕上只有模糊的光，不能標記。試試移動透鏡，或改看凸透鏡。）');
    } else {
      if (o.eye === 'virtual') { st.mark = { x: o.x, y: o.y, label: '虛像標記' }; say('你：這是，正立、放大、虛像，鬼與像都在透鏡對面。'); }
      else if (o.eye === 'realInFront') say('（透鏡裡看到的是倒立的像——這是實像，不是虛像。）');
      else say('（透鏡裡模糊看不清，不能標記。）');
    }
    draw();
  });
  window.addEventListener('resize', resize);
  load(1); resize();
  window.__virtualDemo = { st: st, optics: optics, lensRange: lensRange, load: load, moveLens: moveLens };
})();
</script>
</body>
</html>
