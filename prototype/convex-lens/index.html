<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>第二關：城堡走廊 — 光學抓鬼</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<style>
  :root { --bg:#0d1020; --panel:#171b33; --line:#2c3359; --text:#e8ebff; --dim:#9aa3cf; --accent:#ffd166; --mark:#ff5fd2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    overscroll-behavior: none; touch-action: manipulation; }
  /* 「☰ 關卡」放在右上角（使用者 2026-11-18 回饋 G1，三關統一）：它是 #app 的直接子項，佔第一列最右邊一格 */
  #app { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"top menu" "status status" "stage stage" "ctrl ctrl"; height:100vh; height:100dvh; width:100%; overflow:hidden; }
  #topbar { grid-area:top; } #status { grid-area:status; } #stage { grid-area:stage; } #controls { grid-area:ctrl; }
  #menuBox { grid-area:menu; display:flex; align-items:center; padding:3px 8px 3px 4px; background:var(--panel); border-bottom:1px solid var(--line); }
  #topbar { display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
  #topbar h1 { font-size:14px; margin:0; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  #topbar h1 small { color:var(--dim); font-weight:400; }
  select, button { font:inherit; color:var(--text); background:#232a4d; border:1px solid #3b4478; border-radius:10px; min-height:46px; padding:4px 10px; font-size:16px; }
  button { cursor:pointer; user-select:none; -webkit-user-select:none; touch-action: manipulation; }
  button:active { background:#34407a; }
  button:disabled { opacity:.38; cursor:default; }
  button.on { background:#4a3f12; border-color:var(--accent); color:var(--accent); }
  button.primary { background:#5b2a86; border-color:#b980ff; font-weight:600; }
  #hud { flex:1 1 auto; display:flex; align-items:center; gap:14px; min-height:40px; font-size:16px; font-weight:600; }
  #hearts { display:inline-flex; gap:4px; font-size:26px; line-height:1; color:#ff4d6d; text-shadow:0 0 8px rgba(255,77,109,.6); }
  #hearts .lost { color:#3a3f5e; text-shadow:none; }
  #hud.hit #hearts { animation:hudHit .6s ease-out; }
  @keyframes hudHit { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-5px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }
  #debugBtn { min-height:40px; font-size:13px; padding:2px 8px; }
  #configSel { min-height:40px; font-size:14px; }
  #status { padding:6px 10px; font-size:15px; line-height:1.35; min-height:3.2em; background:#12152a; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  #menuBtn { flex:0 0 auto; min-height:40px; font-size:14px; padding:2px 10px; white-space:nowrap; }
  #stage { position:relative; min-height:0; overflow:hidden; background:#000; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #zoomBox { position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px; }
  #zoomBox button { width:50px; height:50px; min-height:50px; padding:0; font-size:22px; background:rgba(35,42,77,.92); }
  #zoomBox #zoomFit { font-size:13px; }
  #debugPanel { position:absolute; left:6px; top:6px; max-width:min(92%, 330px); font:11px/1.45 ui-monospace, Menlo, Consolas, monospace; background:rgba(0,0,0,.72); color:#9dffb0; border:1px solid #2f7a45; border-radius:6px; padding:6px 8px; pointer-events:none; white-space:pre-wrap; }
  #banner { position:absolute; left:50%; top:10px; transform:translateX(-50%); width:min(92%, 430px); background:rgba(20,16,40,.94); border:1px solid #b980ff; border-radius:12px; padding:10px 12px; font-size:15px; line-height:1.45; pointer-events:none; text-align:center; transition:opacity .4s; }
  #controls { background:var(--panel); border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; }
  /* 觀察、光路分析的按鈕都只排一排（使用者 2026-11-18 回饋 V1、V2）。直拿的窄螢幕才允許換行（備援版面） */
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .row > button { flex:1 1 0; min-width:60px; padding:4px 6px; white-space:nowrap; }
  /* 「看布幕／看透鏡」兩個並排的切換鈕：在布幕（透鏡）那一欄正下方；橫向版面時 app.js 把寬度設成和那一欄對齊 */
  .row > #lookBox { flex:2 1 0; display:flex; min-width:0; }
  .row > #lookBox.col { flex:0 0 auto; }
  #lookBox > button { white-space:nowrap; }
  .row > button.wide { flex:1.6 1 0; }
  .seg > button { flex:1 1 0; min-width:0; padding:4px 4px; }
  .seg > button:first-child { border-radius:10px 0 0 10px; }
  .seg > button:last-child { border-radius:0 10px 10px 0; border-left:none; }
  /* 橫放的手機：高度很少，把兩排控制項併成一排、狀態列縮成一行 */
  @media (max-height: 480px) {
    #topbar { padding:3px 8px; }
    #status { min-height:0; padding:4px 10px; font-size:15px; }
    #menuBox { padding:2px 8px 2px 4px; }
    .row { flex-wrap:nowrap; }
    .row > button { min-width:44px; padding:4px 2px; font-size:15px; }
    #zoomBox { flex-direction:row; }
    #banner { font-size:14px; padding:6px 10px; width:min(70%, 520px); }
  }
  /* 凸透鏡：布幕與實像標記在畫面右側。標記在下半部時縮放鈕放右上；
     標記在上半部（鬼在主光軸下方的配置）時改放右下（app.js 加上 .low），才不會蓋住標記。 */
  #zoomBox { top:8px; bottom:auto; }
  #zoomBox.low { top:auto; bottom:8px; }
  /* 關卡模式、畫面夠寬時：說明文字併到愛心右邊，同一列（原本愛心後面整列空著），省下一列高度給畫面 */
  @media (min-width: 560px) {
    #app.lvl { grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"top status menu" "stage stage stage" "ctrl ctrl ctrl"; }
    #app.lvl #topbar { padding-right:4px; }
    #app.lvl #hud { flex:0 0 auto; white-space:nowrap; }
    #app.lvl #status { min-height:0; background:var(--panel); padding:4px 8px; }
  }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 id="title">凸透鏡原型 <small>自由練習</small></h1>
    <div id="hud" hidden>
      <span id="hearts" role="img"><span>♥</span><span>♥</span><span>♥</span></span>
      <span id="sealCount"></span>
    </div>
    <select id="configSel" aria-label="測試配置"></select>
    <button id="debugBtn" type="button" aria-pressed="false">Debug</button>
  </header>
  <div id="menuBox"><button id="menuBtn" type="button" aria-label="回關卡選單">☰ 回關卡</button></div>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="zoomBox" hidden>
      <button id="zoomIn" type="button" aria-label="放大">＋</button>
      <button id="zoomOut" type="button" aria-label="縮小">－</button>
      <button id="zoomFit" type="button" aria-label="顯示全圖">全圖</button>
    </div>
    <div id="debugPanel" hidden></div>
    <div id="banner" hidden></div>
  </main>
  <footer id="controls">
    <div id="exploreControls">
      <div class="row">
        <button id="nudgeLeft" type="button" aria-label="透鏡往左微調">◀ 微調</button>
        <button id="markBtn" type="button" class="primary">標記</button>
        <button id="nudgeRight" type="button" aria-label="透鏡往右微調">微調 ▶</button>
        <button id="toAnalysis" type="button" disabled>光路分析</button>
        <!-- 「看布幕／看透鏡」跟著布幕（透鏡）那一欄：在它正下方、和按鈕列同一排，寬度由 app.js 的 placeLookBox() 對齊那一欄（使用者 2026-11-20） -->
        <span id="lookBox" class="seg"><button id="lookScreen" type="button" class="on" aria-pressed="true">看布幕</button><button id="lookLens" type="button" aria-pressed="false">看透鏡</button></span>
      </div>
    </div>
    <div id="analysisControls" hidden>
      <!-- 「連線」拿掉了（回饋 V2）：畫線模式下拖曳、依序點兩個點都能畫線 -->
      <div class="row">
        <button id="toExplore" type="button">重新對焦</button>
        <button id="modeSeal" type="button">選格封印</button>
        <button id="modeDraw" type="button" class="on">畫線</button>
        <button id="undoBtn" type="button">復原</button>
        <button id="clearBtn" type="button">清除</button>
        <button id="castBtn" type="button" class="primary wide" disabled hidden>丟圓盤封印</button>
        <button id="replayBtn" type="button" class="wide" hidden>光路重現</button>
        <button id="nextBtn" type="button" class="wide" hidden>下一組配置</button>
      </div>
    </div>
  </footer>
</div>
<script src="../shared/fullscreen.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/leaderboard-config.js"></script>
<script src="../shared/leaderboard.js"></script>
<script src="../shared/landscape.js"></script>
<script src="../shared/optics-core.js"></script>
<script src="../shared/ray-replay.js"></script>
<script src="../shared/story-scene.js"></script>
<script src="../shared/sfx.js"></script>
<script src="../shared/ghost-sprite.js"></script>
<script src="../shared/seal-fx.js"></script>
<script src="configs.js"></script>
<script src="app.js"></script>
</body>
</html>
